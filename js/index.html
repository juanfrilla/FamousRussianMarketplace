            align-items: center;
            display: flex;
            height: 5rem;
            justify-content: center
        }

        .loader {
            height: 5rem;
            position: relative;
            width: 5rem
        }

        .loader-hidden {
            visibility: hidden
        }

        .loader-ellipse {
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
            background-color: currentColor;
            border-radius: 50%;
            height: .85rem;
            position: absolute;
            top: 2rem;
            width: .85rem
        }

        .loader-ellipse:first-child {
            animation: ellipse-1 .6s infinite;
            left: .5rem
        }

        .loader-ellipse:nth-child(2) {
            animation: ellipse-2 .6s infinite;
            left: .5rem
        }

        .loader-ellipse:nth-child(3) {
            animation: ellipse-2 .6s infinite;
            left: 2rem
        }

        .loader-ellipse:nth-child(4) {
            animation: ellipse-3 .6s infinite;
            left: 3.5rem
        }

        @keyframes ellipse-1 {
            0% {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        @keyframes ellipse-2 {
            0% {
                transform: translate(0)
            }

            to {
                transform: translate(1.5rem)
            }
        }

        @keyframes ellipse-3 {
            0% {
                transform: scale(1)
            }

            to {
                transform: scale(0)
            }
        }

        .recommendations {
            margin: 8px 0;
            padding-left: 24px
        }
    </style>
